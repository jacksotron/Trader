trading:
  # How often the agent runs (minutes)
  interval_minutes: 30

  # Risk management — aggressive profile: high risk / high reward
  max_position_pct: 25.0        # Max % of portfolio in any single position
  max_daily_loss_pct: 10.0      # Stop trading if daily loss exceeds this %
  max_portfolio_risk_pct: 90.0  # Max % of portfolio deployed at once
  min_cash_reserve_pct: 5.0     # Always keep this % as cash

  # Exits (defaults the agent applies to every position)
  stop_loss_pct: 8.0            # Exit longs this % below entry
  take_profit_pct: 20.0         # Start scaling out this % above entry

  # Order settings
  default_order_type: limit     # Marketable limit: priced off the live quote with a slippage cap
  limit_order_slippage_pct: 0.3 # Buys cap at ask*(1+x%); sells floor at bid*(1-x%)

  # Execution discipline — orders are never queued while the market is closed
  execution:
    avoid_open_minutes: 15      # No new entries in the first N minutes (opening auction chaos)
    avoid_close_minutes: 5      # No new entries into the closing auction
    max_spread_pct: 1.0         # Skip entries when bid/ask spread exceeds this % of mid

  # Options trading
  options:
    enabled: true
    max_dte: 45                  # Max days to expiration
    min_dte: 1                   # Min days to expiration (short-dated allowed)
    max_delta: 0.90              # Max absolute delta for options
    min_delta: 0.10              # Min absolute delta (deep OTM lottery plays allowed)
    max_contracts: 10            # Max contracts per trade

  # Asset class toggles
  assets:
    stocks: true
    crypto: true
    options: true

  # Watchlists — agent can trade any of these
  stocks_watchlist:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - SPY
    - QQQ

  crypto_watchlist:
    - BTC
    - ETH
    - SOL
    - DOGE
    - ADA

  # Market hours (Eastern Time)
  market_hours:
    open: "09:30"
    close: "16:00"
    extended_hours: false

  # Agent behavior
  agent:
    model: claude-opus-4-8
    effort: high
    system_context: |
      You are an expert algorithmic trader with deep knowledge of equities, options,
      and cryptocurrency markets. Your goal is to grow the portfolio through disciplined,
      risk-managed trades. Always consider market conditions, momentum, fundamentals,
      and risk before placing any trade. Preserve capital above all else.
